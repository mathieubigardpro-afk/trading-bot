name: Fetch market data

# Déclencheurs :
#   - schedule : samedi 05h UTC (ajout session hebdomadaire #6, 2026-09-07) — la branche
#     `market-data` n'était jusqu'ici régénérée QUE par dispatch manuel ou par un push
#     touchant ce pipeline (constat de la session #6 : dernière régénération le 2026-08-24,
#     2 semaines de staleness pour les sessions de recherche). Samedi 05h : avant la
#     maintenance hebdo du dimanche 22h, hors de la fenêtre du daily-data-cache (21h30).
#     NOTE : en tout début de mois, l'archive mensuelle Binance Vision du mois précédent
#     peut ne pas encore être publiée — les symboles crypto sont alors exclus par la règle
#     de complétude et la branche n'est pas mise à jour pour eux ; le run suivant rattrape.
#   - workflow_dispatch : lancement manuel depuis l'onglet Actions.
#   - push sur les chemins qui définissent ce pipeline lui-même (tools/fetch_data.py ou ce
#     fichier yml) : c'est le SEUL moyen de déclencher le tout premier run depuis un
#     environnement où l'API GitHub n'est pas accessible (pas de workflow_dispatch possible
#     via `gh`/API à ce moment-là) — le push final de la mission déclenche donc
#     automatiquement ce workflow.
on:
  schedule:
    - cron: "0 5 * * 6"
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "tools/fetch_data.py"
      - ".github/workflows/fetch-data.yml"

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 45 -> 75min : les sections funding/perp (`--only` par défaut désormais
    # crypto,equities,etf,funding,perp, cf. tools/fetch_data.py) ajoutent ~2x30 paires
    # d'archives mensuelles Binance Futures USDT-M à télécharger -- marge non testée en
    # conditions réelles (proxy réseau bloqué en dev), à recalibrer après le premier run.
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # persist-credentials (par défaut true) laisse actions/checkout configurer
          # l'authentification ambiante (http.extraheader) dans .git/config : le script
          # git de tools/fetch_data.py peut ensuite faire un `git push --force` sur la
          # branche orpheline `market-data` sans jamais manipuler de token lui-même.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # yfinance : source primaire actions/ETF (stooq.com bloque/rate-limite les IP
          # datacenter GitHub Actions — cf. commentaire dans tools/fetch_data.py — stooq
          # reste en repli par ticker, aucune dépendance supplémentaire nécessaire pour lui).
          pip install requests pandas pyarrow yfinance

      - name: Run fetch_data.py
        run: python tools/fetch_data.py
