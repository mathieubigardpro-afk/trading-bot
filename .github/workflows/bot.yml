name: Bot cycle

# Déclencheurs :
#   - schedule : CORRECTIF PLANIFICATION (2026-07-27) : passé de 3 à 6 tentatives par heure
#     (":00, :10, :20, :30, :40, :50") — l'ancien rythme "7,27,47" (3 tentatives) laissait un
#     cycle entier perdu (pas de rattrapage possible avant l'heure suivante, cf. runbook
#     ARCHITECTURE.md) dès qu'UNE SEULE tentative échouait pour une raison transitoire
#     (timeout runner, indisponibilité GitHub Actions...). L'idempotence par `run_id` horaire
#     (`state/cycle.json`) trie déjà tout en quelques secondes : la 2e/3e/... tentative d'une
#     même heure constate `run_id` déjà traité et sort immédiatement (code 0, aucun appel
#     réseau) — multiplier les tentatives est donc gratuit, seul le détecteur de trous
#     (`bot.runner._detect_equity_gaps`, journalisé dans `decisions.jsonl` en `gap_detected`)
#     sert désormais à repérer les heures malgré tout restées sans aucun cycle abouti, SANS
#     jamais tenter de rattrapage rétroactif (signaux quotidiens — rejouer une heure manquée
#     n'aurait aucune valeur et serait risqué).
#   - workflow_dispatch : lancement manuel (rattrapage, debug).
#   - push sur ce fichier lui-même : run de validation immédiat dès le premier push (seul
#     moyen de vérifier le pipeline sans attendre le prochain créneau ni dépendre de l'API
#     GitHub, inaccessible depuis l'environnement qui a produit ce commit).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bot.yml"

permissions:
  contents: write

# Un seul cycle à la fois : jamais d'annulation d'un run en cours (un cycle en cours de
# git_sync ne doit jamais être interrompu au milieu d'un push), le suivant attend en file.
concurrency:
  group: bot-cycle
  cancel-in-progress: false

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    # INCIDENT 2026-07-24 : les cycles T13/T14 ont disparu SANS AUCUNE trace — le job a été tué
    # par ce timeout (alors à 15 min) en pleine ouverture du marché US, pendant le téléchargement
    # direct des ~112 historiques journaliers actions/ETF (bot/feeds/daily.py). Deux correctifs
    # structurels : (1) ce téléchargement lourd est désormais sorti du cycle horaire, régénéré
    # une fois par jour par .github/workflows/daily-data-cache.yml et lu ici depuis un cache
    # disque (étape "Checkout data-cache" ci-dessous) ; (2) le repli réseau direct restant (cache
    # absent/périmé/incomplet) est plafonné à 6 min (bot.feeds.daily.EQUITY_ETF_FETCH_DEADLINE_
    # SECONDS). 30 min reste une marge de sécurité supplémentaire, plus jamais un budget serré.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # verify_chain() (bot/persist/audit.py) et pull_rebase/git_sync ont besoin de
          # l'historique complet (pas un clone superficiel) pour opérer sur state/ à travers
          # les commits successifs.
          fetch-depth: 0
          # persist-credentials par défaut (true) : actions/checkout configure
          # http.extraheader dans .git/config pour authentifier les push ultérieurs. Le code
          # de bot/persist/git_sync.py reste volontairement agnostique de ce mécanisme — il
          # ne fait que `git pull --rebase` / `git push` sur le remote `origin` tel quel,
          # sans jamais lire ni modifier son URL.

      - name: Checkout data-cache (cache journalier actions/ETF/crypto)
        uses: actions/checkout@v4
        continue-on-error: true # la branche peut ne pas encore exister (tout premier run avant
        # que .github/workflows/daily-data-cache.yml n'ait tourné une première fois) — dans ce
        # cas bot/feeds/daily.py:_try_load_from_disk_cache() ne trouve simplement rien (répertoire
        # data-cache/ absent) et retombe sur le repli réseau direct plafonné, sans échec du job.
        with:
          ref: data-cache
          path: data-cache # relatif à la racine du workspace = racine du dépôt (checkout
          # ci-dessus) — c'est exactement là que bot/feeds/daily.py:_cache_dir() cherche le
          # cache par défaut (`<racine dépôt>/data-cache`, cf. bandeau "INCIDENT 2026-07-24"
          # dans ce module). Ignoré par git (.gitignore) : jamais commité par erreur par le
          # cycle horaire, qui ne git-add que des chemins explicites (bot/persist/git_sync.py).
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # yfinance : bot/feeds/daily.py (poches actions xs_momentum_sp100 + ETF dual_momentum_etf)
          # l'utilise comme source primaire (téléchargement par lots) pour le repli réseau direct
          # (cache data-cache/ absent/périmé/incomplet), repli stooq.com si absent/en échec — le
          # cycle reste fonctionnel sans yfinance, mais en disponibilité dégradée (stooq seul).
          pip install pandas numpy requests yfinance

      - name: Configure git identity
        run: |
          git config user.name "Trading Bot"
          git config user.email "bot@trading.local"

      - name: Run bot cycle
        run: |
          set -o pipefail
          python -m bot.runner 2>&1 | tee /tmp/cycle.log

      - name: Publier le log du cycle sur la branche logs
        if: always()
        # Observabilité (incident 2026-07-24) : à l'origine déclenché seulement `if: failure()`
        # (timeout/exception, aucune autre trace exploitable faute d'accès à l'API GitHub pour
        # lire les logs du run). Passé temporairement à `if: always()` (2026-07-24 ~18h10 UTC,
        # incident de suivi "poches actions/ETF toujours quote_available=false malgré le
        # spread synthétique activé") : un cycle peut désormais "réussir" (commit créé,
        # NO_TRADE partout) tout en cachant un problème réseau/parsing côté
        # `bot/feeds/equities.py` invisible dans `decisions.jsonl` (quote_source=None ne
        # distingue pas "requête Yahoo v7 en échec total" d'un simple bid/ask manquant) — capture
        # donc TOUJOURS /tmp/cycle.log + contexte sur la branche dédiée "logs" (force-push, 20
        # logs les plus récents conservés), entièrement via git (accessible même sans API
        # GitHub).
        #
        # MAJ 2026-07-24 ~19h20 UTC : ce log a permis d'identifier la VRAIE cause racine (429
        # Too Many Requests sur `/v7/finance/quote` en bloc, cf. ARCHITECTURE.md §12.6) — le
        # correctif (repli `yfinance`, commit f5e1df8) est poussé sur `main`, mais n'a PAS pu
        # être validé en conditions réelles aujourd'hui : le run_id horaire "2026-07-24T19" était
        # déjà consommé (run de diagnostic ~19h01 UTC, AVANT le correctif) et l'idempotence
        # (`state/cycle.json`) empêche tout second cycle sous le même run_id — les créneaux
        # 19h27/19h47 UTC restants n'exécutent donc RIEN (abandon silencieux). Le prochain run_id
        # disponible (2026-07-24T20) tombe exactement à la clôture NYSE (20:00 UTC, borne
        # exclusive dans `bot/feeds/calendar.py:is_us_market_open` — `t < MARKET_CLOSE_TIME`),
        # donc marché déjà fermé. Validation en conditions réelles reportée à la prochaine
        # ouverture (lundi 2026-07-27). Garder `if: always()` jusqu'à cette validation, puis
        # revenir à `if: failure()` une fois le correctif confirmé sur un cycle marché ouvert.
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          RUN_ID_ATTENDU="$(date -u +%Y-%m-%dT%H)"
          LOGWORK="$(mktemp -d)"

          git fetch origin logs --depth=1 2>/dev/null || true
          if git rev-parse --verify --quiet refs/remotes/origin/logs >/dev/null; then
            git worktree add -B logs "$LOGWORK" refs/remotes/origin/logs
          else
            git worktree add --detach "$LOGWORK" HEAD
            git -C "$LOGWORK" checkout --orphan logs
            git -C "$LOGWORK" rm -rf --quiet . || true
          fi

          mkdir -p "$LOGWORK/logs"
          {
            echo "== Cycle bot (job.status=${{ job.status }}) =="
            echo "date_utc: $(date -u -Iseconds)"
            echo "run_id_attendu: ${RUN_ID_ATTENDU}"
            echo "sha_main: ${GITHUB_SHA}"
            echo "github_run_id: ${GITHUB_RUN_ID}"
            echo "github_run_attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "github_run_number: ${GITHUB_RUN_NUMBER}"
            echo "workflow: ${GITHUB_WORKFLOW}"
            echo "event: ${GITHUB_EVENT_NAME}"
            echo "=========================="
            cat /tmp/cycle.log 2>/dev/null || echo "(/tmp/cycle.log absent — échec avant même le démarrage du runner)"
          } > "$LOGWORK/logs/cycle-${STAMP}.log"

          # Ne garder que les 20 logs les plus récents (force-push ci-dessous : branche de
          # données entièrement régénérable, aucune valeur à conserver dans son historique).
          cd "$LOGWORK"
          ls -1t logs/*.log | tail -n +21 | xargs -r rm -f

          git add -A
          git -c user.name="Trading Bot" -c user.email="bot@trading.local" \
            commit -m "Cycle ${RUN_ID_ATTENDU} (run ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}, status=${{ job.status }}) — log capturé"
          git push --force origin logs

          cd "${GITHUB_WORKSPACE}"
          git worktree remove "$LOGWORK" --force

# (touch: run de validation déclenché manuellement le 2026-07-24 ~19h01 UTC — le run précédent
# (18h17) est tombé sur run_id=2026-07-24T18 déjà traité (idempotence : "abandon silencieux
# propre", aucun appel réseau equities effectué, log inexploitable pour le diagnostic). Ce
# nouveau touch a forcé un run sous run_id=2026-07-24T19 (nouvelle heure UTC), qui a exécuté
# réellement bot/feeds/equities.py:get_prices_equity et révélé le 429 documenté en
# ARCHITECTURE.md §12.6 — AVANT que le correctif yfinance (commit f5e1df8) ne soit prêt. Le
# run_id="2026-07-24T19" étant déjà consommé, un nouveau touch ici ne servirait à rien
# aujourd'hui : validation en conditions réelles du correctif reportée à l'ouverture de marché
# suivante (lundi 2026-07-27, premier cron 07/27/47 après 13h30 UTC = 9h30 ET).)
